<div class="step-container">
  <h2>Tenancy Information</h2>
  <p>Please provide information about the tenancy you're applying for.</p>

  <div [formGroup]="form" class="step-form">
    <mat-form-field class="step-form-field" appearance="outline">
      <mat-label>Lease Start Date</mat-label>
      <input matInput [matDatepicker]="startDatePicker" formControlName="leaseStartDate">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #startDatePicker></mat-datepicker>
      <mat-error *ngIf="form.get('leaseStartDate')?.hasError('required')">
        Lease Start Date is required
      </mat-error>
    </mat-form-field>

    <mat-form-field class="step-form-field" appearance="outline">
      <mat-label>Lease Term (months)</mat-label>
      <input matInput type="number" formControlName="leaseTerm">
      <mat-error *ngIf="form.get('leaseTerm')?.hasError('required')">
        Lease Term is required
      </mat-error>
    </mat-form-field>

    <mat-form-field class="step-form-field" appearance="outline">
      <mat-label>Monthly Rent ($)</mat-label>
      <input matInput type="number" formControlName="monthlyRent">
      <mat-error *ngIf="form.get('monthlyRent')?.hasError('required')">
        Monthly Rent is required
      </mat-error>
    </mat-form-field>
  </div>
</div>
